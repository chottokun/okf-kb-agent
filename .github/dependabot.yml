version: 2
updates:
  # Keep GitHub Actions (checkout, setup-python, setup-uv, ...) current so the
  # CI does not drift onto deprecated runtimes again.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
